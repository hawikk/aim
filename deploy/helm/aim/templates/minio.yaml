{{- if .Values.minio.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aim.fullname" . }}-minio
  labels:
    {{- include "aim.labels" . | nindent 4 }}
    {{ include "aim.selectorLabels" (dict "component" "minio" "context" .) | nindent 4 }}
spec:
  type: {{ .Values.minio.service.type | default "ClusterIP" }}
  selector:
    {{- include "aim.selectorLabels" (dict "component" "minio" "context" .) | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.minio.service.apiPort }}
      targetPort: api
    - name: console
      port: {{ .Values.minio.service.consolePort }}
      targetPort: console
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aim.fullname" . }}-minio
  labels:
    {{- include "aim.labels" . | nindent 4 }}
    {{ include "aim.selectorLabels" (dict "component" "minio" "context" .) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate # single-writer volume
  selector:
    matchLabels:
      {{- include "aim.selectorLabels" (dict "component" "minio" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aim.selectorLabels" (dict "component" "minio" "context" .) | nindent 8 }}
    spec:
      containers:
        - name: minio
          image: {{ include "aim.image" (dict "image" .Values.minio.image "context" .) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args: ["server", "/data", "--console-address", ":{{ .Values.minio.service.consolePort }}"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "aim.secretName" . }}
                  key: OBJECT_STORE_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "aim.secretName" . }}
                  key: OBJECT_STORE_SECRET_KEY
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.minio.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "aim.fullname" . }}-minio
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- if .Values.minio.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "aim.fullname" . }}-minio
  labels:
    {{- include "aim.labels" . | nindent 4 }}
    {{ include "aim.selectorLabels" (dict "component" "minio" "context" .) | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.minio.persistence.storageClass }}
  storageClassName: {{ .Values.minio.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.minio.persistence.size }}
{{- end }}
{{- end }}
