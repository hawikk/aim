{{- if not .Values.secrets.existingSecret }}
{{- /* External data plane needs a pre-created secret with DATABASE_URL (and
     S3 keys). Chart-generated URL only points at in-cluster Postgres. */ -}}
{{- if not .Values.postgres.enabled }}
{{- fail "postgres.enabled=false requires secrets.existingSecret with DATABASE_URL pointing at managed Postgres" }}
{{- end }}
{{- if not .Values.minio.enabled }}
{{- fail "minio.enabled=false requires secrets.existingSecret with OBJECT_STORE_* keys (and objectStore.endpoint)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aim.secretName" . }}
  labels:
    {{- include "aim.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s-postgres:%v/%s" .Values.secrets.postgresUser .Values.secrets.postgresPassword (include "aim.fullname" .) .Values.postgres.service.port .Values.secrets.postgresDatabase | quote }}
  OBJECT_STORE_ACCESS_KEY: {{ .Values.secrets.minioRootUser | quote }}
  OBJECT_STORE_SECRET_KEY: {{ .Values.secrets.minioRootPassword | quote }}
  INGEST_TOKENS: {{ .Values.secrets.ingestTokens | quote }}
  ENROLL_TOKENS: {{ .Values.secrets.enrollTokens | quote }}
  AIM_HASH_SALT: {{ .Values.secrets.hashSalt | quote }}
  AIM_SESSION_SECRET: {{ .Values.secrets.sessionSecret | quote }}
  AIM_OIDC_CLIENT_SECRET: {{ .Values.secrets.oidcClientSecret | default .Values.api.oidc.clientSecret | quote }}
  {{- /* AIM-716: per-provider secrets when multi-IdP is configured */ -}}
  {{- range $p := (.Values.api.oidc.providers | default list) }}
  {{- $idUpper := $p.id | upper | replace "-" "_" }}
  AIM_OIDC_{{ $idUpper }}_CLIENT_SECRET: {{ $p.clientSecret | default "" | quote }}
  {{- end }}
  # IdP X.509 PEM for SAML SP (AIM-715). Empty when SAML is unused.
  AIM_SAML_IDP_CERT: {{ .Values.secrets.samlIdpCert | quote }}
{{- end }}
