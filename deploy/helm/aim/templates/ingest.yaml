apiVersion: v1
kind: Service
metadata:
  name: {{ include "aim.fullname" . }}-ingest
  labels:
    {{- include "aim.labels" . | nindent 4 }}
    {{ include "aim.selectorLabels" (dict "component" "ingest" "context" .) | nindent 4 }}
spec:
  type: {{ .Values.ingest.service.type | default "ClusterIP" }}
  selector:
    {{- include "aim.selectorLabels" (dict "component" "ingest" "context" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ingest.service.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aim.fullname" . }}-ingest
  labels:
    {{- include "aim.labels" . | nindent 4 }}
    {{ include "aim.selectorLabels" (dict "component" "ingest" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.ingest.replicas }}
  selector:
    matchLabels:
      {{- include "aim.selectorLabels" (dict "component" "ingest" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aim.selectorLabels" (dict "component" "ingest" "context" .) | nindent 8 }}
        {{- if and .Values.progressiveDelivery .Values.progressiveDelivery.versionLabel }}
        app.kubernetes.io/version: {{ .Values.progressiveDelivery.versionLabel | quote }}
        aim.monitoring/canary-version: {{ .Values.progressiveDelivery.versionLabel | quote }}
        {{- end }}
    spec:
      {{- with include "aim.appPodSecurityContext" . }}
      securityContext:
        {{- . | nindent 8 }}
      {{- end }}
      {{- with include "aim.appPlacement" (dict "component" "ingest" "context" . "Values" .Values) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: ingest
          {{- with include "aim.appContainerSecurityContext" . }}
          securityContext:
            {{- . | nindent 12 }}
          {{- end }}
          image: {{ include "aim.image" (dict "image" .Values.ingest.image "context" .) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "aim.secretName" . }}
                  key: DATABASE_URL
            - name: INGEST_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ include "aim.secretName" . }}
                  key: INGEST_TOKENS
            - name: ENROLL_TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ include "aim.secretName" . }}
                  key: ENROLL_TOKENS
            - name: OBJECT_STORE_ENDPOINT
              value: {{ include "aim.objectStoreEndpoint" . | quote }}
            - name: OBJECT_STORE_BUCKET
              value: {{ .Values.secrets.minioBucket | quote }}
            - name: OBJECT_STORE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "aim.secretName" . }}
                  key: OBJECT_STORE_ACCESS_KEY
            - name: OBJECT_STORE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "aim.secretName" . }}
                  key: OBJECT_STORE_SECRET_KEY
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ingest.resources | nindent 12 }}
