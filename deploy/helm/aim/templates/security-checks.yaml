{{/*
fail-closed security gates for chart values.

Always enforced (even on the dev shape):
  - Postgres and MinIO Services must stay ClusterIP (no public data-store exposure).

When security.allowInsecureDefaults is false (values-standard / values-airgapped):
  - api.authDev must be off
  - api.oidc.issuer + clientId required
  - chart-generated secrets must not be empty or the documented local-only placeholders
  - ingress, when enabled, requires host + TLS
  - app Services (api/ingest) must not be LoadBalancer/NodePort unless
    security.allowPublicServices is true (explicit residual-risk accept)
*/}}
{{- $sec := .Values.security | default dict }}
{{- $allowInsecure := true }}
{{- if hasKey $sec "allowInsecureDefaults" }}
  {{- $allowInsecure = index $sec "allowInsecureDefaults" }}
{{- end }}
{{- $allowPublic := false }}
{{- if hasKey $sec "allowPublicServices" }}
  {{- $allowPublic = index $sec "allowPublicServices" }}
{{- end }}

{{- /* --- Always: data stores must not be public -------------------------------- */}}
{{- $pgType := (.Values.postgres.service.type | default "ClusterIP") }}
{{- if or (eq $pgType "LoadBalancer") (eq $pgType "NodePort") (eq $pgType "ExternalName") }}
{{- fail (printf "postgres.service.type=%q is blocked; data stores must use ClusterIP" $pgType) }}
{{- end }}
{{- $minioType := (.Values.minio.service.type | default "ClusterIP") }}
{{- if or (eq $minioType "LoadBalancer") (eq $minioType "NodePort") (eq $minioType "ExternalName") }}
{{- fail (printf "minio.service.type=%q is blocked; data stores must use ClusterIP" $minioType) }}
{{- end }}

{{- if not $allowInsecure }}
  {{- /* --- authDev ------------------------------------------------------------ */}}
  {{- if .Values.api.authDev }}
  {{- fail "api.authDev=true is forbidden when security.allowInsecureDefaults=false (dev login endpoints)" }}
  {{- end }}

  {{- /* --- OIDC required for shared/prod shapes ------------------------------- */}}
  {{- if not .Values.api.oidc.issuer }}
  {{- fail "api.oidc.issuer is required when security.allowInsecureDefaults=false (no personal/standalone mode)" }}
  {{- end }}
  {{- if not .Values.api.oidc.clientId }}
  {{- fail "api.oidc.clientId is required when security.allowInsecureDefaults=false" }}
  {{- end }}

  {{- /* --- Secrets: refuse empty / well-known local-only placeholders --------- */}}
  {{- if not .Values.secrets.existingSecret }}
    {{- $localOnly := list "localdev-only-not-a-secret" "dev-token-change-me" "dev-enroll-token-change-me" "changeme" "password" "secret" }}
    {{- $pgPass := .Values.secrets.postgresPassword | default "" | toString }}
    {{- $minioPass := .Values.secrets.minioRootPassword | default "" | toString }}
    {{- $ingest := .Values.secrets.ingestTokens | default "" | toString }}
    {{- $enroll := .Values.secrets.enrollTokens | default "" | toString }}
    {{- $hashSalt := .Values.secrets.hashSalt | default "" | toString }}
    {{- $session := .Values.secrets.sessionSecret | default "" | toString }}
    {{- $oidcSecret := .Values.secrets.oidcClientSecret | default .Values.api.oidc.clientSecret | default "" | toString }}

    {{- if or (eq $pgPass "") (has $pgPass $localOnly) }}
    {{- fail "secrets.postgresPassword is empty or a documented local-only placeholder; set a real value or secrets.existingSecret" }}
    {{- end }}
    {{- if or (eq $minioPass "") (has $minioPass $localOnly) }}
    {{- fail "secrets.minioRootPassword is empty or a documented local-only placeholder; set a real value or secrets.existingSecret" }}
    {{- end }}
    {{- if or (eq $ingest "") (has $ingest $localOnly) }}
    {{- fail "secrets.ingestTokens is empty or a documented local-only placeholder; set a real value or secrets.existingSecret" }}
    {{- end }}
    {{- if and $enroll (has $enroll $localOnly) }}
    {{- fail "secrets.enrollTokens uses a documented local-only placeholder; set a real value, clear it to disable enroll, or use secrets.existingSecret" }}
    {{- end }}
    {{- if eq $hashSalt "" }}
    {{- fail "secrets.hashSalt is required when security.allowInsecureDefaults=false (pseudonymization must not be inert)" }}
    {{- end }}
    {{- if eq $session "" }}
    {{- fail "secrets.sessionSecret is required when security.allowInsecureDefaults=false (no ephemeral session keys)" }}
    {{- end }}
    {{- if eq $oidcSecret "" }}
    {{- fail "OIDC client secret is required (secrets.oidcClientSecret or api.oidc.clientSecret, or secrets.existingSecret with AIM_OIDC_CLIENT_SECRET)" }}
    {{- end }}
  {{- end }}

  {{- /* --- App service exposure ----------------------------------------------- */}}
  {{- if not $allowPublic }}
    {{- $apiType := (.Values.api.service.type | default "ClusterIP") }}
    {{- if or (eq $apiType "LoadBalancer") (eq $apiType "NodePort") }}
    {{- fail (printf "api.service.type=%q is blocked unless security.allowPublicServices=true (prefer Ingress + TLS)" $apiType) }}
    {{- end }}
    {{- $ingestType := (.Values.ingest.service.type | default "ClusterIP") }}
    {{- if or (eq $ingestType "LoadBalancer") (eq $ingestType "NodePort") }}
    {{- fail (printf "ingest.service.type=%q is blocked unless security.allowPublicServices=true" $ingestType) }}
    {{- end }}
  {{- end }}

  {{- /* --- Ingress posture ---------------------------------------------------- */}}
  {{- if .Values.ingress.enabled }}
    {{- if not .Values.ingress.host }}
    {{- fail "ingress.host is required when ingress.enabled=true and security.allowInsecureDefaults=false" }}
    {{- end }}
    {{- if not .Values.ingress.tls }}
    {{- fail "ingress.tls must be true when ingress.enabled=true and security.allowInsecureDefaults=false" }}
    {{- end }}
  {{- end }}
{{- end }}
