# AI Monitoring platform — default values.
#
# These defaults are the *dev/single-node* shape: they bring the full stack
# up on a throwaway cluster with the same documented local-only credentials
# as docker-compose.yml. For production use values-standard.yaml; for multi-AZ
# enterprise use values-enterprise.yaml; for air-gapped installs see
# values-airgapped.yaml and docs/deployment/air-gapped-install.md.
#
# Security posture (AIM-601): the chart fail-closes insecure opens when
# security.allowInsecureDefaults=false (set by values-standard /
# values-airgapped / values-enterprise). See
# docs/security/helm-values-security-defaults.md.

global:
  # Prepended to every image repository (e.g. "registry.corp.local/mirror").
  # Used by the air-gapped installer to point at an internal registry.
  imageRegistry: ""
  # Set to "Never" by the air-gapped installer when images are pre-loaded
  # onto the nodes (no registry at all).
  imagePullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

# ----------------------------------------------------------------------------
# Security gates (AIM-601) + pod security defaults (AIM-553).
# Applied to app workloads (ingest/api/guardrail/migrate). Postgres/MinIO
# keep vendor image defaults — see docs/deployment/helm-security-defaults-audit.md
# and docs/security/helm-values-security-defaults.md.
# ----------------------------------------------------------------------------
security:
  # true  = chart defaults may use local-only secrets, personal/standalone
  #         auth, and empty session/hash salt (throwaway clusters only).
  # false = helm template/install refuses authDev, local-only secret
  #         placeholders, empty critical secrets, missing OIDC, public
  #         app services, and ingress without TLS.
  allowInsecureDefaults: true
  # Explicit residual-risk accept for api/ingest LoadBalancer or NodePort
  # when allowInsecureDefaults=false. Data stores (postgres/minio) can
  # never be public regardless of this flag.
  allowPublicServices: false
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    # Images already set USER (node / guardrail). readOnlyRootFilesystem is
    # left false: Node needs writable /tmp unless emptyDir mounts are added.
    readOnlyRootFilesystem: false
    seccompProfile:
      type: RuntimeDefault

# PDBs only render for components with replicas > 1.
podDisruptionBudgets:
  enabled: false
  minAvailable: 1

# ----------------------------------------------------------------------------
# Multi-AZ placement (AIM-635). Off by default for single-node dev clusters.
# values-enterprise.yaml turns these on.
# ----------------------------------------------------------------------------
topology:
  spread:
    enabled: false
    maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    # ScheduleAnyway so single-zone clusters still schedule; enterprise sets DoNotSchedule.
    whenUnsatisfiable: ScheduleAnyway
  antiAffinity:
    enabled: false
    weight: 100
    topologyKey: kubernetes.io/hostname

# NetworkPolicy pack (AIM-769 / AIM-635). Off by default; enterprise enables.
networkPolicy:
  enabled: false
  # When true, emit a default-deny-all for chart pods plus selective allows.
  defaultDeny: true
  # Optional NetworkPolicyPeer list for api/ingest ingress (empty = all).
  allowIngressFrom: []
  # CIDRs for external Postgres/S3 egress when postgres/minio.enabled=false.
  # Empty → 0.0.0.0/0 (tighten to VPC CIDRs in production).
  externalEgressCIDRs: []
  dnsNamespace: kube-system

# Progressive delivery knobs (AIM-635). Labels only — no Argo Rollouts dep.
progressiveDelivery:
  # Optional version label applied to api/ingest pods for canary selection.
  versionLabel: ""
  # Extra canary replica Deployment for api is NOT generated by the chart;
  # operators skew .api.replicas and image tags across releases. See
  # docs/deployment/progressive-delivery.md.

# ----------------------------------------------------------------------------
# Secrets. Defaults match docker-compose.yml's documented local-only values —
# override all of these (or use existingSecret) for any shared environment.
# ----------------------------------------------------------------------------
secrets:
  # Name of a pre-created secret to use instead of the chart-generated one.
  # It must provide these keys:
  #   POSTGRES_PASSWORD, DATABASE_URL, OBJECT_STORE_ACCESS_KEY,
  #   OBJECT_STORE_SECRET_KEY, INGEST_TOKENS, ENROLL_TOKENS, AIM_HASH_SALT,
  #   AIM_SESSION_SECRET
  # and, when api.oidc.issuer is set:
  #   AIM_OIDC_CLIENT_SECRET
  existingSecret: ""

  postgresUser: aim
  postgresPassword: localdev-only-not-a-secret # NOT for production
  postgresDatabase: aim

  minioRootUser: aim-local
  minioRootPassword: localdev-only-not-a-secret # NOT for production
  minioBucket: aim-telemetry-local

  # Comma-separated bearer tokens collectors use to POST /v1/events.
  ingestTokens: dev-token-change-me # NOT for production
  # Comma-separated enrollment tokens collectors exchange for per-device
  # tokens via POST /v1/enroll (AIM-80). Empty = enrollment disabled.
  enrollTokens: dev-enroll-token-change-me # NOT for production
  # Pseudonymization salt shared with collectors (AIM-78). Empty = the
  # restricted-repo-access guardrail rule stays inert (fail-closed).
  hashSalt: ""
  # HMAC key that signs the dashboard session cookie (AIM-95). Empty = the
  # API generates an ephemeral one at boot (sessions die on restart —
  # acceptable for local dev only).
  sessionSecret: ""
  # See api.oidc.clientSecret — only used when api.oidc.issuer is set.
  oidcClientSecret: ""
  # IdP signing certificate PEM for SAML SP (AIM-715). Prefer existingSecret.
  samlIdpCert: ""

ingest:
  image:
    repository: aim/ingest
    tag: "" # defaults to .Chart.AppVersion
  replicas: 1
  service:
    # ClusterIP only by default. LoadBalancer/NodePort rejected under
    # security.allowInsecureDefaults=false unless allowPublicServices=true.
    type: ClusterIP
    port: 8080
  resources: {}
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# Dashboard API + bundled web UI (apps/api serves apps/web/public).
api:
  image:
    repository: aim/api
    tag: "" # defaults to .Chart.AppVersion
  replicas: 1
  # Authentication (AIM-95 / AIM-302 / AIM-715): with oidc.issuer *or*
  # saml.entryPoint set, the API runs in-app SSO (OIDC PKCE and/or SAML 2.0
  # SP) with an HMAC-signed session cookie and maps IdP groups to roles via
  # roleGroups below. With neither configured the API runs in
  # personal/standalone mode (a single local admin identity) — acceptable for
  # a single-user eval, NOT for a shared deployment. There is no proxy-auth
  # mode: client-supplied identity headers (X-Forwarded-*, X-AIM-*) are never
  # trusted. SAML runbook: docs/deployment/saml-sso-runbook.md
  oidc:
    issuer: ""
    clientId: ""
    # Prefer secrets.existingSecret with an AIM_OIDC_CLIENT_SECRET key over
    # putting the value here.
    clientSecret: ""
    # Defaults to https://<ingress.host>/auth/callback when ingress is set.
    redirectUri: ""
    groupsClaim: groups
    # AIM-716 multi-IdP: when non-empty, takes precedence over issuer/clientId.
    # Each entry needs id + clientId; issuer required except google (preset).
    # Secrets: AIM_OIDC_<ID>_CLIENT_SECRET on existingSecret (recommended).
    # Example:
    # providers:
    #   - id: google
    #     clientId: aim-google
    #   - id: entra
    #     issuer: https://login.microsoftonline.com/TENANT/v2.0
    #     clientId: aim-entra
    #   - id: okta
    #     issuer: https://example.okta.com
    #     clientId: aim-okta
    #     scopes: openid profile email groups
    providers: []
  # SAML 2.0 SP (AIM-715). When entryPoint is set, also set idpIssuer and
  # put the IdP signing cert PEM in secrets.samlIdpCert (or existingSecret
  # key AIM_SAML_IDP_CERT).
  saml:
    entryPoint: ""
    idpIssuer: ""
    # Defaults to https://<ingress.host>/auth/saml/acs when ingress is set.
    callbackUrl: ""
    # Defaults to https://<ingress.host> when ingress is set.
    spEntityId: ""
    groupsAttribute: groups
  roleGroups:
    admin: ai-monitoring-security
    analyst: ai-monitoring-analysts
    auditor: ai-monitoring-auditors
    viewer: ai-monitoring-viewers
  # Reveal grant (AIM-302 §1 / AIM-384): de-pseudonymization is a separate
  # capability, NOT a role and not bundled into admin. Same group name as
  # identity-sync's reveal gate.
  revealGroups: ai-monitoring-revealers
  # authDev: true adds /auth/dev/login role-switch endpoints — LOCAL UI
  # DEVELOPMENT ONLY, never acceptable for a shared environment.
  # Incompatible with requireSso (chart fails render if both are true).
  # Fail-closed under security.allowInsecureDefaults=false (AIM-601).
  authDev: false
  # requireSso: true sets AIM_REQUIRE_SSO=1 — API refuses to boot in
  # personal/local-admin mode if neither OIDC nor SAML is complete
  # (AIM-545 / AIM-715 pilot graduation). values-standard.yaml enables this;
  # leave false for personal eval installs.
  requireSso: false
  service:
    type: ClusterIP
    port: 8080
  resources: {}

guardrail:
  image:
    repository: aim/guardrail
    tag: "" # defaults to .Chart.AppVersion
  replicas: 1
  pollInterval: "15" # seconds between evaluate-db ticks
  healthPort: 8090   # /healthz + /readyz served by poll mode (AIM-98)
  resources: {}

postgres:
  # Set false when DATABASE_URL points at external multi-AZ Postgres
  # (Cloud SQL / RDS / AlloyDB). Requires secrets.existingSecret with DATABASE_URL.
  enabled: true
  image:
    repository: postgres
    tag: 16-alpine
  service:
    # Always ClusterIP. LoadBalancer/NodePort are hard-blocked (AIM-601).
    type: ClusterIP
    port: 5432
  persistence:
    enabled: true
    size: 5Gi
    storageClass: "" # cluster default
  resources: {}

minio:
  # Set false when using external S3-compatible object store.
  # Then set objectStore.endpoint (and put keys in existingSecret).
  enabled: true
  image:
    repository: minio/minio
    tag: RELEASE.2025-04-22T22-12-26Z
  service:
    # Always ClusterIP. LoadBalancer/NodePort are hard-blocked (AIM-601).
    type: ClusterIP
    apiPort: 9000
    consolePort: 9001
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  resources: {}

# External/object-store endpoint override (AIM-635). Used when minio.enabled=false
# or when you need a non-in-cluster endpoint.
objectStore:
  # e.g. https://s3.eu-central-1.amazonaws.com or http://minio.other-ns:9000
  endpoint: ""

# One-shot bucket bootstrap (post-install/upgrade hook job).
minioInit:
  image:
    repository: minio/mc
    tag: RELEASE.2025-04-16T18-13-26Z

# Optional ingress for the dashboard. SSO is terminated in-app by the API
# itself (api.oidc above); the ingress only needs TLS. See
# docs/deployment/hosted-preview-sso-runbook.md.
ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls: false
