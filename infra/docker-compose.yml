name: ai-monitoring

# Minimal stack (Postgres + ingest) used by the ingest test suite and the
# README's "run the tests" path. Published ports name an interface and default
# to loopback for the same reason the root docker-compose.yml does — see the
# AIM-184 note there. Widen deliberately with AIM_BIND_ADDR /
# AIM_DATASTORE_BIND_ADDR; both fall back to 127.0.0.1 when set empty.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aimon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-aimon}
    ports:
      - "${AIM_DATASTORE_BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  ingest:
    build:
      context: ..
      dockerfile: services/ingest/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-aimon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aimon}
      INGEST_TOKENS: ${INGEST_TOKENS:?Set INGEST_TOKENS (see .env.example)}
    ports:
      - "${AIM_BIND_ADDR:-127.0.0.1}:${INGEST_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
