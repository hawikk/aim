# Friend-preview hardening:
# - per-IP rate + connection limits (GFE passes client via X-Forwarded-For)
# - optional basic auth when /etc/nginx/.htpasswd exists
# - healthz stays open for Cloud Run probes

map $http_x_forwarded_for $client_ip {
    default $remote_addr;
    ~^(?P<first>[^,]+) $first;
}

limit_req_zone $client_ip zone=preview_req:10m rate=5r/s;
limit_conn_zone $client_ip zone=preview_conn:10m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Trust Cloud Run / GFE forwarded client address for rate limits
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;
    real_ip_recursive on;

    # Keep default server tight under abuse
    client_max_body_size 16k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    send_timeout 10s;
    keepalive_timeout 10s;
    server_tokens off;

    limit_req zone=preview_req burst=15 nodelay;
    limit_conn preview_conn 8;
    limit_req_status 429;
    limit_conn_status 429;

    # Preview-only public landing — no caching of HTML so friends always see latest
    location / {
        auth_basic "AIM landing preview";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy no-referrer;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /healthz {
        access_log off;
        auth_basic off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
