# Guardrail ruleset v1 — observe-only posture (policy decision, 2026-07-21),
# AMENDED 2026-07-22 (later amendment): "observe + endpoint blocking
# for critical rules". The platform-side engine below remains detect-and-alert
# only; the amendment authorizes ENDPOINT blocking for the critical ruleset
# via the `enforcement:` section, delivered to collectors as a managed
# enforcement.json bundle. Metadata-only posture is unchanged in both halves.
#
# COMPLIANCE NOTE: findings always have decision: "observe". That is
# the platform engine. Do NOT treat 100% observe findings as proof that
# endpoint enforcement is off — check usage events for
# enforcement.action ∈ {blocked, would_block, confirmed} and
# enforcement_posture.policy. A fleet without a delivered enforcement.json
# fail-opens and will show zero blocks even when this file says mode: enforce.
#
# POLICY CONTENT IS A PROPOSAL. The engine and rule mechanism are owned by
# engineering; the rules below — thresholds, allowlists, severities
# must be approved by Security before they are treated as enforced policy.
# Changes to anything under policies/ go through PR review (policy-as-code).
#
# Rules evaluate the canonical AI usage event (packages/schema, v1). Event
# fields used here: tool, tool_raw, provider, model, host_ref, user_ref,
# repo_ref, session_id, source, tokens_in, tokens_out, ts, event_type,
# tool_calls[] ({tool_name, mcp_server, action_class, count, duration_ms} —
# tool-use metadata from tool_use events; never arguments or content),
# configured_mcp_servers[] ({name, scope} — MCP servers present in the tool's
# config files, from inventory events; never commands/args/env),
# match_flags[] ({detector, category, severity} — detector results computed
# at the collection point; matched content never crosses the wire).
#
# Rule types:
#   match     — stateless, evaluated against each event (`when` condition tree).
#   threshold — stateful sliding-window aggregation grouped by `group_by` fields;
#               fires once when the aggregated `metric` crosses gt/gte, refires
#               only after the window value drops back below the threshold.
#
# Condition ops: eq, neq, in, not_in, contains, contains_detector, gt, gte,
# lt, lte, not_in_approved_providers_for, in_off_hours, in_restricted_repos,
# mcp_call_to_unapproved_server, tool_call_action_class_in,
# tool_call_name_matches, configured_mcp_server_unapproved,
# mcp_call_to_unapproved_tool.
# Conditions combine with `all:` / `any:` (one level of nesting supported).
#
# rules may carry `inert_until:` (list of machine-readable keys).
# The dashboard / GET /api/guardrail/rules labels rules inert when those
# prerequisites are unmet — never ship a permanently silent control without
# a visible inert label.
version: 1

settings:
  # Sanctioned tool allowlist (locked policy decision). First-class schema
  # tools outside this list (kimi_code, grok_build) are still reportable by
  # name but score as unapproved until Security promotes them.
  # PROPOSAL: consider adding grok_build once dogfood + works-council
  # posture is reviewed — do NOT treat this comment as approval.
  # unapproved-tool now matches tool not_in this list (not only
  # tool==other), so first-class-but-unapproved tools fire findings.
  approved_tools: [claude_code, cursor, kilo_code]
  # Approved provider per sanctioned tool. Tool absent from this map = no
  # provider restriction. Proposal — Security to confirm the matrix.
  # PROPOSAL: if grok_build is approved, add:
  #   grok_build: [xai]
  approved_providers:
    claude_code: [anthropic]
    cursor: [anthropic, openai, google]
    kilo_code: [anthropic, openai, google, openrouter]
  # Approved models per sanctioned tool. Empty map = no
  # model restriction (degrade open until Security populates). When a tool
  # has a non-empty list, models outside it fire model-provider-not-permitted.
  # Optional team overrides: team_approved_models.<team>.<tool> = [models…].
  # PROPOSAL — Security to confirm before any enforce rollout.
  # model-provider-not-permitted is labelled inert-by-design for the
  # model-allowlist half until this map is non-empty; provider-matrix half
  # still fires for tools with approved_providers entries.
  approved_models: {}
  team_approved_models: {}
  # Off-hours window in endpoint-local time when the event carries local_hour
  # (proposed additive schema field), else UTC hour of ts. 20:00 inclusive to
  # 07:00 exclusive. Proposal — confirm against works-council guidance.
  off_hours_start: 20
  off_hours_end: 7
  # Restricted repositories: cleartext repo
  # identifiers as collectors see them (working-directory paths; normalization
  # matches the collectors: normpath + lowercase + backslash->slash). The
  # engine HMACs each entry with the same AIM_HASH_SALT the collectors use
  # and matches event.repo_ref directly. Rules that depend on this list are
  # INERT until the list is non-empty AND AIM_HASH_SALT is set on the
  # guardrail service (dashboard labels them inert_until_configured).
  #
  # Security sign-off (dogfood host, 2026-08-01): populate with
  # genuine sensitive working-directory roots. Exact-match against event cwd
  # (platform rules); endpoint file-path prefix match uses
  # enforcement.restricted_repo_paths below. Multi-host fleets must extend
  # this list with each site's absolute roots (or wait for git-remote
  # identity). Historical pilot events used per-install salt and will not
  # match until collectors roll to the company salt.
  restricted_repos:
    # Unified security stack — secrets, IdP, enroll tokens, CA material
    - /home/vaque/dogfood/security-stack
    - /home/vaque/security-stack
    # Direct work inside the secrets trees (credential stores)
    - /home/vaque/dogfood/security-stack/secrets
    - /home/vaque/security-stack/secrets
    # IdP / IAM credential material (OIDC client secrets, admin hashes)
    - /home/vaque/dogfood/security-stack/secrets/idp
    - /home/vaque/security-stack/secrets/idp
    # GCP service-account JSON / cloud IAM keys
    - /home/vaque/dogfood/security-stack/secrets/gcp
    - /home/vaque/security-stack/secrets/gcp
    # Host IAM / CI credential store (AWS shared credentials + config)
    - /home/vaque/.aws
  # Approved MCP servers: server
  # identifiers as they appear in tool_calls[].mcp_server on tool_use events.
  # Exact string match only (no wildcards). Grow via policy PR or
  # PUT /api/mcp-allowlist.
  #
  # mcp_allowlist_mode is deny_unlisted (closed discovery). A null
  # mcp_server (unknown server) always counts as unapproved.
  #
  # Pilot seed (2026-08-01): first-party Claude connector ids already present
  # on the endpoint enforcement bundle since
  # (deploy/enforcement/*.json, collectors/.../default_enforcement.json).
  # Live pilot inventory still shows 0 named MCP servers; this is platform↔
  # endpoint reconciliation so enforce is not empty-deny-all. Analysts can
  # grow/shrink via PUT /api/mcp-allowlist (machine-owned mcp-allowlist.yaml).
  # See.
  mcp_allowlist_mode: deny_unlisted # was: discovery (closed)
  approved_mcp_servers:
    - ide
    - claude_ai_Gmail
    - claude_ai_Google_Calendar
  # per-(server, tool) allowlist on top of server allowlist.
  # Empty = no tool-level restriction (server allowlist alone applies).
  # When non-empty, entries are "server/tool_name" exact strings (or
  # {server, tool_name} objects). MCP calls whose pair is absent fire
  # unapproved-mcp-tool. Never stores argument content — names only.
  # Full matrix shape: policies/mcp/tool-argument-policy.schema.json
  # (metadata constraints only; content inspection remains privacy-blocked).
  approved_mcp_tools: []
  # Credential-shaped tool-name needles. Matched
  # segment-aware (camelCase + snake_case) against tool_calls[].tool_name —
  # metadata only, never args. Bare "token" suppresses usage/pagination/
  # tokenizer names (count_tokens, get_next_page_token) unless a credential
  # co-segment is present.
  credential_tool_name_substrings:
    - secret
    - credential
    - password
    - passwd
    - token
    - apikey
    - api_key
    - private_key
    - service_account
    - vault
    - keychain
    - aws_access
    - ".env"

  # Endpoint inline enforcement (Phase 1; amended 2026-07-22,
  # approved). This section is the policy-as-code SOURCE OF TRUTH for
  # the enforcement.json bundle endpoint tooling delivers to collectors
  # (managed file, same channel as the collector config). The collector reads
  # only this shape; it never parses this YAML.
  #
  # mode: shadow = compute decisions and emit would_block audit events, never
  # interrupt. mode: enforce = apply decisions for rules whose per-rule
  # `enforce` flag is true AND (when configured) whose host is inside the
  # rule's cohort canary. The global mode is the fleet-wide kill switch
  # (rollback to shadow is a one-field flip — see).
  # The per-rule flag is Security's toggle after the gates clear.
  # optional per-rule `cohort: {percent: 0-100, salt: "…"}` (or
  # top-level `cohort`) ramps enforce without fleet blast radius — outside
  # hosts stay would_block; expand/rollback is a policy_hash bump only.
  #
  # (2026-07-29): phase-1 secret-pattern-in-prompt flipped to enforce
  # shadow bake + detector tuning. Evidence:
  #. Measured FP rate on the labeled
  # corpus is 0% (precision 1.00 / recall 1.00); dogfood window after tuning
  # produced 0 secret would-blocks.
  #
  # decision C (2026-08-01): unapproved-mcp-server flipped
  # to enforce after non-empty pilot allowlist + break-glass doc.
  # (2026-08-14) flips restricted-repo on the *pilot overlay only*
  # (enforcement.pilot.json) quiet-gate certification. Fleet
  # YAML and enforcement.enforce.json stay false until a policy expansion
  # decision. PII fleet default stays observe (pilot overlay).
  #
  # Fail-open is contractual: missing/malformed bundle or any hook error =
  # observe. PII and injection detectors are NOT hard-blockable at the endpoint
  # in phase 1 — secret patterns only. Phase 2a (below) adds
  # restricted-repo deny and the pii-in-prompt CONFIRM-PROMPT (a challenge the
  # user confirms by resubmitting — not a hard block). ADDITIONAL GATE for the
  # phase-2a rules: phase 1 shipped AND 2 weeks of quiet block-rate telemetry
  # reviewed (later amendment 2026-07-22).
  enforcement:
    mode: enforce
    rules:
      # UserPromptSubmit: hard-block when any secret:* detector fires.
      # Break-glass: resubmit identical prompt within secret_override_ttl_seconds
      # (audited as action 'confirmed' with rule_id + policy_hash).
      secret-pattern-in-prompt:
        enforce: true
      # model/provider allowlist — observe until Security approves
      # the matrix and an enforce bake. Endpoint collectors ignore this flag
      # until a phase-N hook lands; platform findings fire in observe today.
      model-provider-not-permitted:
        enforce: false
      # PreToolUse: deny MCP calls to servers outside approved_mcp_servers.
      # pilot enforce ON after non-empty allowlist (see above).
      # Kill-switch: set false or global mode: shadow. Fail-open on missing
      # bundle.
      # platform allowlist is non-empty (endpoint-reconciled seed).
      # Enforce flip is — keep false until post-load observe bake +
      # break-glass doc are complete. Kill-switch remains this flag or global
      # mode: shadow. Fail-open on missing/malformed bundle.
      unapproved-mcp-server:
        enforce: true
      # Phase 2a. PreToolUse: deny file-touching tool calls
      # (file_path/path/notebook_path) under a restricted root. Bash free
      # text is out of scope at the endpoint. flipped the *pilot
      # overlay* to enforce; this fleet default stays false. Break-glass:
      #.
      restricted-repo-access:
        enforce: false
      # Phase 2a (gated). UserPromptSubmit: confirm-prompt when any
      # pii:* detector fires — first submission is challenged, resubmitting
      # the identical prompt within pii_confirm_ttl_seconds confirms and
      # proceeds (audited as action 'confirmed', schema v1.6).
      pii-in-prompt:
        enforce: false
    # Mirrors settings.approved_mcp_servers for the endpoint bundle.
    # Mirrors settings.approved_mcp_servers for the endpoint bundle.
    # Must stay in sync with settings.approved_mcp_servers above.
    approved_mcp_servers:
      - ide
      - claude_ai_Gmail
      - claude_ai_Google_Calendar
    # endpoint-local absolute paths of restricted roots
    # (boundary-safe prefix match on tool file_path/path/notebook_path).
    # Mirrors the sensitive absolute roots from settings.restricted_repos.
    # Fleet restricted-repo-access.enforce stays false (is
    # pilot-overlay only). Populating this list de-inerts shadow/observe
    # evaluation on fleet hosts.
    restricted_repo_paths:
      - /home/vaque/dogfood/security-stack/secrets
      - /home/vaque/security-stack/secrets
      - /home/vaque/dogfood/security-stack/secrets/idp
      - /home/vaque/security-stack/secrets/idp
      - /home/vaque/dogfood/security-stack/secrets/gcp
      - /home/vaque/security-stack/secrets/gcp
      - /home/vaque/.aws
    # seconds a PII confirm challenge stays valid (1..3600).
    pii_confirm_ttl_seconds: 120
    # seconds a secret break-glass override stays valid (1..3600).
    secret_override_ttl_seconds: 120
    # seconds an MCP deny break-glass (identical tool resubmit) stays valid.
    mcp_override_ttl_seconds: 120
    # seconds a restricted-repo deny break-glass (identical tool+path)
    # stays valid. Endpoint-only; unused while fleet enforce stays false.
    restricted_repo_override_ttl_seconds: 120
    # when true, local resubmit alone never overrides a secret
    # block — an approved, unexpired control-plane grant must be present on the
    # endpoint (synced via GET /api/enforcement/break-glass/active-grants).
    # DEFAULT false (pilot one-step break-glass). Enabling requires Security
    # sign-off (no silent policy expansion). When true, first resubmit opens a
    # local approval request; confirm only after an operator grant + ticket id.
    secret_override_requires_manager: false
    # How long a manager grant stays valid after ops write it (1..86400).
    secret_override_manager_grant_ttl_seconds: 3600

rules:
  - id: unapproved-tool
    type: match
    severity: high
    title: Unapproved AI coding tool in use
    description: >-
      Tool is outside settings.approved_tools (sanctioned set).
      fixed a coverage hole: the rule previously matched only tool=="other",
      so first-class-but-unapproved schema tools (kimi_code, grok_build) never
      produced findings despite being outside the allowlist. Now matches any
      tool not in approved_tools. tool_raw (e.g. aider, codeium, windsurf)
      is carried in finding evidence when present. Observe-only; do not
      enforce until Security reviews the dogfood hit rate (kimi_code dominates
      the pilot corpus).
    when:
      all:
        - field: tool
          not_in: approved_tools

  - id: unapproved-provider-or-model
    type: match
    severity: high
    title: Unapproved provider for AI tool traffic
    description: >-
      A sanctioned tool is talking to a provider outside its approved matrix, or
      a collection-point detector flagged policy:unapproved-* (e.g. personal API
      key endpoint, third-party relay domain). Uses not_in_approved_providers_for
      (settings-aware). Tools absent from approved_providers are not restricted
      here — pair with unapproved-tool for first-class unapproved tools.
    when:
      any:
        - field: match_flags
          contains_detector: "policy:unapproved-domain"
        - field: match_flags
          contains_detector: "policy:unapproved-provider"
        - field: provider
          not_in_approved_providers_for: tool

  # scoped model/provider allowlist. Provider-matrix half is active
  # for tools with approved_providers entries. Model-allowlist half degrades
  # open while approved_models is empty — inert_until labels that half.
  - id: model-provider-not-permitted
    type: match
    severity: high
    title: Model/provider not permitted for scope
    description: >-
      The event's model or provider is outside the allowlist for its scope
      (team override when present, else global approved_models, else the
      approved_providers matrix). Observe-only until settings.enforcement
      flips enforce for this rule. Operational store
      model_provider_allowlist (migration 019) can hold runtime rows; the
      policy-as-code settings remain the engine source of truth.
    inert_until:
      - approved_models_or_providers_scope
    when:
      all:
        - field: model
          model_provider_not_permitted_for_scope: true

  - id: restricted-repo-access
    type: match
    severity: critical
    title: AI tool used against a restricted repository
    description: >-
      The event's pseudonymized repo_ref matches Security's restricted list
      (settings.restricted_repos — secrets-heavy, regulated, or customer-data
      repos). The engine re-derives the HMAC pseudonyms itself from the
      configured list; requires AIM_HASH_SALT on the guardrail
      service. Findings carry only the pseudonym, never the repo name.
      labelled inert_until_configured while the list is empty or
      salt is unset — not a silent "always green" control.
    inert_until:
      - restricted_repos_populated
      - aim_hash_salt_configured
    when:
      all:
        - field: repo_ref
          in_restricted_repos: true

  - id: secret-pattern-in-prompt
    type: match
    severity: critical
    title: Secret-like pattern detected in AI tool traffic
    description: >-
      A secret:* detector fired at the collection point (category "secret").
      Only the boolean outcome and detector name are stored — never the matched
      content. First candidate for the 60-day measurable security win.
    when:
      all:
        - field: match_flags
          contains_detector: "secret:*"

  - id: pii-in-prompt
    type: match
    # asked for "warning" severity. The platform scale is
    # low/medium/high/critical, so this ships as "low" (the warning tier);
    # the approved Sentinel taxonomy maps pii_pattern_detected to
    # Medium on the Sentinel side. A distinct "warning" level would be a
    # taxonomy change — needs Security approval.
    severity: low
    title: PII-like pattern detected in AI tool traffic
    description: >-
      A pii:* detector fired at the collection point (category "pii":
      pii:email, pii:credit-card, pii:us-ssn, pii:iban; added EU
      national IDs — pii:es-dni-nie, pii:fr-nir, pii:de-steuerid,
      pii:it-codice-fiscale). Only the detector name is stored — never the
      matched content. Surfaces PII exposure in the findings console instead
      of only as a dashboard aggregate.
    when:
      all:
        - field: match_flags
          contains_detector: "pii:*"

  - id: injection-attempt-in-prompt
    type: match
    # POLICY PROPOSAL — needs Security approval before it is
    # treated as enforced policy, like every v1 rule. Medium severity on
    # purpose: injection:* detectors are prose-class and fire on defensive
    # discussion of injection attacks too (measured and documented in
    # docs/security/detector-evasion-capability.md). Raise per-detector
    # thresholds only after the pilot baseline shows the FP volume.
    severity: medium
    title: Prompt-injection / jailbreak phrasing in AI tool traffic
    description: >-
      An injection:* detector fired at the collection point (
      ignore-instructions, system-prompt-override, prompt-extraction,
      jailbreak-persona, delimiter-override; EN/DE/FR/ES). Detects engineers
      attempting to override or jailbreak a sanctioned tool's guardrails, or
      injection text arriving through pasted content / tool inputs. Only the
      detector name is stored — never the matched text. Regex-class, not a
      semantic classifier: expect both evasion misses and occasional
      defensive-discussion FPs; both are pinned in the evasion corpus.
    when:
      all:
        - field: match_flags
          contains_detector: "injection:*"

  - id: unapproved-mcp-server
    type: match
    severity: high
    title: MCP call to unapproved server
    description: >-
      First rule of the tool-call rail. A tool_calls[]
      entry on a tool_use event is an MCP call (action_class "mcp_call") to a
      server outside settings.approved_mcp_servers — or to an unknown server
      (null mcp_server). closed discovery mode after a full-corpus
      inventory found 0 MCP servers; empty approved_mcp_servers is now a
      formal deny-unlisted allowlist (mcp_allowlist_mode: deny_unlisted).
      Platform findings remain observe-only (engine v1); endpoint PreToolUse
      deny is gated by enforcement.rules.unapproved-mcp-server.enforce
      (pilot: true). Finding evidence carries the offending server
      id + tool name only — never tool arguments, counts, or durations.
      (null mcp_server). closed discovery mode; seeded a
      non-empty deny-unlisted allowlist (mcp_allowlist_mode: deny_unlisted).
      Platform findings remain observe-only (engine v1); endpoint PreToolUse
      deny is gated by enforcement.rules.unapproved-mcp-server.enforce
      (still false). Finding evidence carries the offending
      server id + tool name only — never tool arguments, counts, or durations.
    when:
      all:
        - field: tool_calls
          mcp_call_to_unapproved_server: true


  - id: unapproved-mcp-tool
    type: match
    severity: high
    title: MCP tool call outside approved tool matrix
    description: >-
      tool-argument / tool-level governance. Fires on tool_use events
      when settings.approved_mcp_tools is non-empty and a tool_calls[] entry
      is action_class "mcp_call" whose (mcp_server, tool_name) pair is not on
      the matrix. Empty approved_mcp_tools = rule inert (server allowlist alone).
      Metadata only — offending {tool_name, mcp_server}; never arguments or
      results. Observe-only until Security signs a tool-level matrix + enforce
      bake (endpoint tool-level deny is a separate flip).
    when:
      all:
        - field: tool_calls
          mcp_call_to_unapproved_tool: true

  - id: shell-tool-restricted-repo
    type: match
    severity: high
    title: Shell/command tool used against a restricted repository
    description: >-
      Per-tool-call rail. A tool_calls[] entry with action_class
      "shell" (command execution) fired while the event's repo_ref matches
      Security's restricted list — autonomous command execution inside a
      secrets-heavy or regulated repo is the highest-risk tool action there.
      Same HMAC matching as restricted-repo-access (requires AIM_HASH_SALT).
      labelled inert_until_configured while restricted_repos is
      empty or salt unset. Finding evidence carries tool name + action class
      only — never command lines, counts, or durations.
    inert_until:
      - restricted_repos_populated
      - aim_hash_salt_configured
    when:
      all:
        - field: tool_calls
          tool_call_action_class_in: [shell]
        - field: repo_ref
          in_restricted_repos: true

  - id: network-tool-restricted-repo
    type: match
    severity: medium
    title: Network-egress tool used against a restricted repository
    description: >-
      Per-tool-call rail. A tool_calls[] entry with action_class
      "network" (web fetch/search) fired against a restricted repo — possible
      data movement out of a regulated codebase, lower confidence than shell
      execution, hence medium. Same HMAC matching and inert-until posture as
      shell-tool-restricted-repo. Finding evidence carries tool name +
      action class only — never URLs, counts, or durations.
    inert_until:
      - restricted_repos_populated
      - aim_hash_salt_configured
    when:
      all:
        - field: tool_calls
          tool_call_action_class_in: [network]
        - field: repo_ref
          in_restricted_repos: true

  - id: unapproved-mcp-server-configured
    type: match
    severity: medium
    title: Unapproved MCP server configured in an AI tool
    description: >-
      Per-tool-call rail, the new-MCP-server detection
      alert. Fires on inventory events (schema v1.2): a
      configured_mcp_servers[] entry names a server outside
      settings.approved_mcp_servers. Empty list = deny-unlisted (discovery
      closed inventory found 0 configured servers). Medium:
      presence in config is intent-to-use, not observed traffic. Platform
      findings observe-only; endpoint inventory is not an interrupt surface.
      Finding evidence names the unapproved server(s) only (name + scope) —
      never commands, args, URLs, or env values.
      settings.approved_mcp_servers. seeded a non-empty deny-unlisted
      allowlist; servers not on the list (and unknown/null) stay unapproved.
      Medium: presence in config is intent-to-use, not observed traffic.
      Platform findings observe-only; endpoint inventory is not an interrupt
      surface. Finding evidence names the unapproved server(s) only (name +
      scope) — never commands, args, URLs, or env values.
    when:
      all:
        - field: configured_mcp_servers
          configured_mcp_server_unapproved: true

  # credential-shaped tool names on tool_calls[] (metadata
  # only). Catches secret-manager / vault / token tooling invoked through AI
  # agents (including MCP tools after collector name-split) without inspecting
  # arguments. Needle list is settings-driven; matcher is segment-aware with
  # token FP suppression (precision review). Observe-only — not an
  # enforce candidate until Security promotes it under block-mode gates.
  - id: credential-shaped-tool-call
    type: match
    severity: high
    title: Credential-shaped tool call
    description: >-
      A tool_calls[] entry has a tool_name that matches a credential-shaped
      needle (settings.credential_tool_name_substrings: secret, vault, token,
      password, …). Segment-aware match (camel + snake); bare token suppresses
      usage/pagination/tokenizer names. Proxy for agents reading or writing
      credentials via tool use, including MCP tool parts after mcp__server__
      split. Metadata only — never arguments or results. Observe-only
      (precision note:).
    when:
      all:
        - field: tool_calls
          tool_call_name_matches: credential_tool_name_substrings

  # high-volume network tool use against one repo (egress signal).
  # Tuned on the 28k-event pilot corpus: network action_class max was 6
  # events/repo/hour; gt:5 flags the rare top of that distribution. Observe.
  - id: high-volume-repo-egress
    type: threshold
    severity: high
    title: High-volume network tool use against one repository
    description: >-
      Many network-class tool_calls (web fetch/search) against a single
      repo_ref within one hour. Proxy for bulk data egress from a codebase
      via AI tooling. Threshold proposed from pilot percentiles — review
      weekly before any enforce path.
    group_by: [repo_ref]
    window_seconds: 3600
    filter:
      all:
        - field: tool_calls
          tool_call_action_class_in: [network]
    metric: count
    gt: 5

  # bulk autonomous shell activity per user. Corpus p90≈228, p99≈631
  # shell events/user/hour; gt:250 flags roughly the top decile. Observe.
  - id: bulk-shell-hourly
    type: threshold
    severity: medium
    title: Bulk shell tool activity (1h window)
    description: >-
      Single user produced many shell-class tool_calls within one hour.
      Proxy for unattended agent loops or bulk automation. Observe-only;
      threshold is a pilot proposal (p90≈228 shell events/user/hour).
    group_by: [user_ref]
    window_seconds: 3600
    filter:
      all:
        - field: tool_calls
          tool_call_action_class_in: [shell]
    metric: count
    gt: 250

  # high token volume per repository (codebase-scale exfil/ingest).
  # Complements user-scoped anomalous-volume-hourly. Corpus p90≈37M
  # tokens/repo/hour; gt:50M is above typical pilot noise.
  - id: high-volume-repo-tokens
    type: threshold
    severity: medium
    title: High AI token volume against one repository
    description: >-
      Total tokens (in+out) against a single repo_ref exceeded the hourly
      budget. Proxy for bulk codebase ingest or large model responses that
      may carry sensitive context. Complements anomalous-volume-hourly
      (user-scoped). Observe-only; threshold proposed from pilot p90/p99.
    group_by: [repo_ref]
    window_seconds: 3600
    metric: sum_tokens
    gt: 50000000

  - id: anomalous-volume-hourly
    type: threshold
    severity: medium
    title: Abnormal AI usage volume (1h window)
    description: >-
      Single user exceeded the hourly token budget. Proxy signal for runaway
      automation, credential sharing, or bulk data movement through an AI tool.
      Threshold is a proposal — tune against the pilot baseline before widening
      alert routing.
    group_by: [user_ref]
    window_seconds: 3600
    metric: sum_tokens          # tokens_in + tokens_out over the window
    gt: 500000

  - id: off-hours-bulk-usage
    type: threshold
    severity: medium
    title: Bulk AI usage during off-hours
    description: >-
      Many events from one user during off-hours (20:00-07:00, endpoint-local
      when available). Candidate signal for unattended workloads or account
      misuse. Low confidence until baselined — observe and review weekly.
    group_by: [user_ref]
    window_seconds: 86400
    filter:
      all:
        - field: ts
          in_off_hours: true
    metric: count
    gt: 100

  # note: per-team budgets with 80/100% alerts are evaluated by the
  # budget module against team_budgets (migration 019), not as fixed YAML
  # thresholds — each team has its own limit. The rules below are the
  # finding rule_ids / severity classes the budget evaluator emits so they
  # show up in the rules viewer and taxonomy. They do not stream-evaluate
  # (no match/threshold window); the evaluator writes findings directly.
  # Documented here for policy-as-code transparency.
